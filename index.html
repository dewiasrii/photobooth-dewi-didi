<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf3fc">
<title>The Wedding Of Dewi &amp; Didi</title>
<style>
:root{--ice:#eaf3fc;--deep:#294e73}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px 10px 26px;background:radial-gradient(ellipse at top,#fff 0%,#edf6ff 48%,#dceafa 100%);color:var(--deep);font-family:Georgia,"Times New Roman",serif}
main{width:min(100%,900px);margin:auto;text-align:center}
header{padding:6px 4px 16px}
h1{font-weight:400;font-size:clamp(29px,6vw,43px);line-height:1.08;margin:0 0 9px}
.date{font:600 11px Arial,sans-serif;letter-spacing:3px;color:#6689ad}
.intro{font-size:14px;line-height:1.55;margin:13px 0 3px}
.booth{width:100%;padding:9px;background:#ffffffd9;border:1px solid #bfd4e8;border-radius:18px;box-shadow:0 15px 40px #345b8020}
.stage{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#dfeaf5;border-radius:9px}
#camera,#result{position:absolute;inset:0;width:100%;height:100%;display:block}
#camera{object-fit:cover;object-position:center 38%;transform:scaleX(-1);background:#dfeaf5}
#result{display:none;object-fit:contain}
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0 7px}
button{border:1px solid #b5cce3;border-radius:999px;padding:12px 17px;font:600 13px Arial,sans-serif;cursor:pointer}
.primary{background:linear-gradient(135deg,#2e5c86,#5e8db9);color:white;box-shadow:0 5px 14px #24496d25}
.secondary{background:#f5f9fe;color:#345b80}
button:disabled{opacity:.5;cursor:not-allowed}
.status{font:12px/1.5 Arial,sans-serif;color:#52789e;min-height:19px;margin:10px 4px}
.note{font:11px/1.6 Arial,sans-serif;color:#7290ad;margin:8px auto 0;max-width:540px}
.hidden{display:none!important}
@media(max-width:600px){body{padding:10px 6px 20px}.booth{padding:6px;border-radius:14px}.stage{aspect-ratio:4/3}button{padding:11px 13px;font-size:12px}}
</style>
</head>
<body>
<main>
<header>
<h1>The Wedding Of<br>Dewi &amp; Didi</h1>
<div class="date">06 DESEMBER 2026</div>
<p class="intro">Abadikan momen bahagia bersama kami.<br>Siapkan senyum terbaikmu! ♡</p>
</header>
<section class="booth">
<div class="stage">
<video id="camera" autoplay playsinline muted></video>
<canvas id="result"></canvas>
<img id="frame" src="frame-dewi-didi.png" alt="">
</div>
<div class="controls">
<button id="captureBtn" class="primary">📷 Ambil Foto</button>
<button id="retakeBtn" class="secondary hidden">↻ Ambil Ulang</button>
<button id="downloadBtn" class="primary hidden">↓ Unduh Foto</button>
</div>
<div id="status" class="status">Mengaktifkan kamera…</div>
<p class="note">Posisikan wajah di tengah area kosong bingkai. Untuk hasil lebih tajam, gunakan cahaya terang dan bersihkan lensa.</p>
</section>
</main>
<script>
const UPLOAD_URL='https://script.google.com/macros/s/AKfycbw5jNsua3HsKkbxORw4XYgqxSMec45SfVRRmBdta3xs4x9-Y51jt8BpMPYsZqaxpFmR/exec';
const UPLOAD_KEY='DewiDidi2026';
const video=document.getElementById('camera'),canvas=document.getElementById('result'),ctx=canvas.getContext('2d');
const frame=document.getElementById('frame'),captureBtn=document.getElementById('captureBtn'),retakeBtn=document.getElementById('retakeBtn'),downloadBtn=document.getElementById('downloadBtn'),statusEl=document.getElementById('status');
let latestDataUrl='',stream=null;
function setStatus(s){statusEl.textContent=s}
async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720},aspectRatio:{ideal:4/3}}});
  video.srcObject=stream;await video.play();
  const track=stream.getVideoTracks()[0];
  if(track&&track.getCapabilities){
   const caps=track.getCapabilities();
   if(caps.zoom&&Number.isFinite(caps.zoom.min)){try{await track.applyConstraints({advanced:[{zoom:caps.zoom.min}]})}catch(e){}}
  }
  setStatus('Kamera siap. Posisikan wajah di tengah area foto.');
 }catch(e){setStatus('Kamera tidak terbuka. Izinkan akses kamera di browser lalu muat ulang.');captureBtn.disabled=true}
}
/* Match preview exactly: fill landscape frame and crop only as much as required. */
function drawCover(source,W,H,mirror=false){
 const sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight;
 if(!sw||!sh)throw Error('Kamera belum siap');
 const scale=Math.max(W/sw,H/sh),cropW=W/scale,cropH=H/scale;
 // Aim slightly above center so the face sits higher, clear of the bottom plaque.
 const sx=(sw-cropW)/2,sy=Math.max(0,Math.min(sh-cropH,(sh-cropH)*0.30));
 ctx.save();
 if(mirror){ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(source,sx,sy,cropW,cropH,0,0,W,H)}
 else ctx.drawImage(source,sx,sy,cropW,cropH,0,0,W,H);
 ctx.restore();
}
function drawPhoto(){
 const W=1200,H=900;canvas.width=W;canvas.height=H;
 ctx.fillStyle='#dfeaf5';ctx.fillRect(0,0,W,H);
 drawCover(video,W,H,true);
 if(frame.complete&&frame.naturalWidth)ctx.drawImage(frame,0,0,W,H);
 latestDataUrl=canvas.toDataURL('image/jpeg',0.94);
}
async function uploadAutomatically(dataUrl){
 setStatus('Mengirim permintaan penyimpanan ke Google Drive…');
 try{
  await fetch(UPLOAD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:UPLOAD_KEY,image:dataUrl})});
  setStatus('Permintaan unggah dikirim. Periksa folder Drive untuk memastikan foto tersimpan.');
 }catch(e){setStatus('Pengiriman ke Drive gagal. Unduh foto sebagai cadangan.')}
}
captureBtn.addEventListener('click',async()=>{
 if(!video.videoWidth){setStatus('Kamera belum siap. Tunggu sebentar lalu coba lagi.');return}
 if(!frame.complete||!frame.naturalWidth){setStatus('File frame-dewi-didi.png tidak terbaca. Pastikan file ada di folder utama GitHub.');return}
 captureBtn.disabled=true;
 try{
  drawPhoto();video.style.display='none';frame.style.display='none';canvas.style.display='block';
  captureBtn.classList.add('hidden');retakeBtn.classList.remove('hidden');downloadBtn.classList.remove('hidden');
  await uploadAutomatically(latestDataUrl);
 }catch(e){setStatus('Gagal membuat foto. Muat ulang halaman lalu coba lagi.');captureBtn.disabled=false}
});
retakeBtn.addEventListener('click',()=>{
 latestDataUrl='';canvas.style.display='none';video.style.display='block';frame.style.display='block';
 captureBtn.classList.remove('hidden');captureBtn.disabled=false;retakeBtn.classList.add('hidden');downloadBtn.classList.add('hidden');
 setStatus('Kamera siap. Posisikan wajah di tengah area foto.');
});
downloadBtn.addEventListener('click',()=>{
 if(!latestDataUrl)return;const a=document.createElement('a');a.href=latestDataUrl;a.download='The_Wedding_Of_Dewi_Didi.jpg';document.body.appendChild(a);a.click();a.remove();
});
startCamera();
</script>
</body>
</html>
