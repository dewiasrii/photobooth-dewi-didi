<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eaf3fc">
<title>The Wedding Of Dewi &amp; Didi</title>
<style>
:root{--ice:#eaf3fc;--deep:#294e73;--blue:#3b6e9b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px 12px 28px;background:radial-gradient(ellipse at top,#fff 0,#edf6ff 48%,#dceafa 100%);color:var(--deep);font-family:Georgia,"Times New Roman",serif}
main{width:min(100%,510px);margin:auto;text-align:center}
header{padding:8px 4px 18px}
h1{font-weight:400;font-size:clamp(30px,7vw,43px);line-height:1.08;margin:0 0 9px}
.date{font:600 11px Arial,sans-serif;letter-spacing:3px;color:#6689ad}
.intro{font-size:15px;line-height:1.6;margin:16px 0 4px}
.booth{padding:10px;background:#ffffffa8;border:1px solid #bfd4e8;border-radius:22px;box-shadow:0 15px 40px #345b8020}
.stage{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;background:#dceaf7}
#camera,#result{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camera{transform:scaleX(-1)}
#result{display:none}
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0 7px}
button{border:1px solid #b5cce3;border-radius:999px;padding:12px 18px;font:600 13px Arial,sans-serif;cursor:pointer}
.primary{background:linear-gradient(135deg,#2e5c86,#5e8db9);color:white;box-shadow:0 5px 14px #24496d25}
.secondary{background:#f5f9fe;color:#345b80}
button:disabled{opacity:.5;cursor:not-allowed}
.status{font:12px/1.5 Arial,sans-serif;color:#52789e;min-height:19px;margin:10px 4px}
.note{font:11px/1.6 Arial,sans-serif;color:#7290ad;margin:8px auto 0;max-width:390px}
.hidden{display:none!important}
@media(max-width:380px){body{padding:10px 7px}.booth{padding:6px}}
</style>
</head>
<body>
<main>
<header>
<h1>The Wedding Of<br>Dewi &amp; Didi</h1>
<div class="date">06 DESEMBER 2026</div>
<p class="intro">Abadikan momen bahagia bersama kami.<br>Siapkan senyum terbaikmu! ♡</p>
</header>
<section class="booth">
<div class="stage">
<video id="camera" autoplay playsinline muted></video>
<canvas id="result"></canvas>
<img id="frame" src="frame-dewi-didi.png" alt="">
</div>
<div class="controls">
<button id="captureBtn" class="primary">📷 Ambil Foto</button>
<button id="retakeBtn" class="secondary hidden">↻ Ambil Ulang</button>
<button id="downloadBtn" class="primary hidden">↓ Unduh Foto</button>
</div>
<div id="status" class="status">Mengaktifkan kamera…</div>
<p class="note">Foto dapat diunduh ke perangkat. Salinan dikirim ke Google Drive jika konfigurasi unggah admin benar. Pastikan file frame-dewi-didi.png ikut diunggah ke GitHub.</p>
</section>
</main>
<script>
const UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbw5jNsua3HsKkbxORw4XYgqxSMec45SfVRRmBdta3xs4x9-Y51jt8BpMPYsZqaxpFmR/exec';
const UPLOAD_KEY = 'DewiDidi2026';
const video=document.getElementById('camera'), canvas=document.getElementById('result');
const ctx=canvas.getContext('2d'), frame=document.getElementById('frame');
const captureBtn=document.getElementById('captureBtn'), retakeBtn=document.getElementById('retakeBtn');
const downloadBtn=document.getElementById('downloadBtn'), statusEl=document.getElementById('status');
let latestDataUrl='',stream=null;
function setStatus(s){statusEl.textContent=s}
async function startCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('No camera');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:1920}},audio:false});
  video.srcObject=stream;await video.play();setStatus('Kamera siap. Tekan “Ambil Foto”.');
 }catch(e){setStatus('Kamera tidak terbuka. Izinkan akses kamera di browser lalu muat ulang.');captureBtn.disabled=true}
}
function drawCover(source,x,y,w,h,mirror=false){
 const sw=source.videoWidth||source.naturalWidth||source.width, sh=source.videoHeight||source.naturalHeight||source.height;
 const scale=Math.max(w/sw,h/sh), cw=w/scale,ch=h/scale,sx=(sw-cw)/2,sy=(sh-ch)/2;
 ctx.save();
 if(mirror){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(source,sx,sy,cw,ch,0,0,w,h)}
 else ctx.drawImage(source,sx,sy,cw,ch,x,y,w,h);
 ctx.restore();
}
function drawPhoto(){
 const W=1024,H=1536;canvas.width=W;canvas.height=H;
 ctx.fillStyle='#eaf3fc';ctx.fillRect(0,0,W,H);
 // The photo is drawn first, then the decorative transparent frame is placed on top.
 drawCover(video,0,0,W,H,true);
 ctx.drawImage(frame,0,0,W,H);
 // Print the couple's wording into the blank lower nameplate area.
 ctx.textAlign='center';ctx.fillStyle='#294e73';
 ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=5;
 ctx.font='42px Georgia';ctx.fillText('The Wedding Of',W/2,1250);
 ctx.font='bold 66px Georgia';ctx.fillText('DEWI & DIDI',W/2,1325);
 ctx.font='26px Arial';ctx.letterSpacing='5px';ctx.fillText('06 DESEMBER 2026',W/2,1375);
 ctx.shadowBlur=0;
 latestDataUrl=canvas.toDataURL('image/jpeg',.92);
}
async function uploadAutomatically(dataUrl){
 try{
  setStatus('Foto siap. Mengirim salinan ke Google Drive…');
  await fetch(UPLOAD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:UPLOAD_KEY,image:dataUrl})});
  setStatus('Permintaan unggah dikirim. Periksa folder Drive untuk memastikan foto tersimpan.');
 }catch(e){setStatus('Pengiriman ke Drive gagal. Silakan unduh foto sebagai cadangan.')}
}
captureBtn.addEventListener('click',async()=>{
 if(!video.videoWidth){setStatus('Kamera belum siap. Tunggu sebentar.');return}
 if(!frame.complete||!frame.naturalWidth){setStatus('File frame-dewi-didi.png belum terbaca. Pastikan file itu ada di GitHub.');return}
 captureBtn.disabled=true;
 try{drawPhoto();video.style.display='none';frame.style.display='none';canvas.style.display='block';captureBtn.classList.add('hidden');retakeBtn.classList.remove('hidden');downloadBtn.classList.remove('hidden');await uploadAutomatically(latestDataUrl)}
 catch(e){setStatus('Gagal membuat foto. Coba muat ulang halaman.');captureBtn.disabled=false}
});
retakeBtn.addEventListener('click',()=>{
 latestDataUrl='';canvas.style.display='none';video.style.display='block';frame.style.display='block';captureBtn.classList.remove('hidden');captureBtn.disabled=false;retakeBtn.classList.add('hidden');downloadBtn.classList.add('hidden');setStatus('Kamera siap. Tekan “Ambil Foto”.')
});
downloadBtn.addEventListener('click',()=>{
 if(!latestDataUrl)return;const a=document.createElement('a');a.href=latestDataUrl;a.download='The_Wedding_Of_Dewi_Didi.jpg';document.body.appendChild(a);a.click();a.remove()
});
startCamera();
</script>
</body>
</html>
